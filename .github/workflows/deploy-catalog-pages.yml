name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "QuickActionsCatalog/**"
      - "sparkle/**"
      - "scripts/build-quick-actions-catalog.sh"
      - "scripts/build-pages-site.sh"
      - ".github/workflows/deploy-catalog-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages site (catalog + appcast)
        run: ./scripts/build-pages-site.sh build/pages-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
