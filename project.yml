name: MenuCue
options:
  bundleIdPrefix: com.walkerfirmin.menucue
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  MenuCue:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "**/.DS_Store"
          - "**/*.applescript"
          - "**/README.txt"
          - "Info.plist"
          - "QuickActionsCatalog"
      - path: Resources/QuickActionsCatalog
        type: folder
        buildPhase: resources
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkerfirmin.menucue.app
        PRODUCT_NAME: MenuCue
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "4"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Resources/Info.plist
        # Do NOT set LSUIElement. Combining it with setActivationPolicy(.accessory)
        # causes Control Center to hide the NSStatusItem on macOS Sonoma/Tahoe.
        # Dock hiding is handled at runtime in AppDelegate.
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © MenuCue"
        INFOPLIST_KEY_CFBundleDisplayName: MenuCue
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        # Use Resources/AppIcon.icns (built with iconutil from master.png).
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: Sources/MenuCue.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: H297ZX38YB
        CODE_SIGN_STYLE: Manual
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        INFOPLIST_KEY_SUFeedURL: "https://walkerfirmin.github.io/MenuCue/appcast.xml"
        INFOPLIST_KEY_SUEnableAutomaticChecks: YES
        INFOPLIST_KEY_SUPublicEDKey: "dXNie/zOTj/g4M9e4InL2F9k5mhoPzaEUPmIZ9TpsKE="
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
        product: Sparkle
    scheme:
      testTargets: []
